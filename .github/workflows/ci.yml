# Build and test on every push to main and every pull request (release plan step C16).
#
# Both test projects are xunit.v3 executables on Microsoft.Testing.Platform; they are run with
# `dotnet run` because `dotnet test` reports zero tests on SDK 10.0.400 with xunit.v3 4.0.0.
# The hosted Windows runner is elevated, so the firewall integration test runs for real.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ArkAscendedServerAdmin.slnx -c Release --nologo

      - name: Unit tests
        run: dotnet run --project test/ArkAscendedServerAdmin.UnitTests/ArkAscendedServerAdmin.UnitTests.csproj -c Release --no-build -- --report-trx --results-directory "${{ github.workspace }}\TestResults"

      - name: Integration tests
        if: ${{ !cancelled() }}
        run: dotnet run --project test/ArkAscendedServerAdmin.Infrastructure.IntegrationTests/ArkAscendedServerAdmin.Infrastructure.IntegrationTests.csproj -c Release --no-build -- --report-trx --results-directory "${{ github.workspace }}\TestResults"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
